<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">The Korven organizational operating model</title>
<desc id="desc">Four connected domains: organization, operations, data, and information.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117" offset="0%"/><stop stop-color="#15231f" offset="100%"/></linearGradient></defs>
<rect width="1200" height="350" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="348" rx="21" fill="none" stroke="#344f46"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="600" y="65" text-anchor="middle" font-size="25" font-weight="700" fill="#ecf7f2">One shared model of organizational work</text>
<rect x="38" y="112" width="240" height="165" rx="18" fill="#182722" stroke="#476b60"/>
 <text x="60" y="144" font-size="15" fill="#8eb5a7" font-weight="700">01</text>
 <text x="158" y="183" text-anchor="middle" font-size="19" fill="#eef9f4" font-weight="700">ORGANIZATION</text>
 <text x="158" y="217" text-anchor="middle" font-size="16" fill="#bdd3ca">Structure · Positions</text>
 <text x="158" y="245" text-anchor="middle" font-size="16" fill="#bdd3ca">People · Responsibility</text>
<rect x="332" y="112" width="240" height="165" rx="18" fill="#182722" stroke="#476b60"/>
 <text x="354" y="144" font-size="15" fill="#8eb5a7" font-weight="700">02</text>
 <text x="452" y="183" text-anchor="middle" font-size="20" fill="#eef9f4" font-weight="700">OPERATIONS</text>
 <text x="452" y="217" text-anchor="middle" font-size="16" fill="#bdd3ca">Workflows · Tasks</text>
 <text x="452" y="245" text-anchor="middle" font-size="16" fill="#bdd3ca">Approvals · Execution</text>
<rect x="626" y="112" width="240" height="165" rx="18" fill="#182722" stroke="#476b60"/>
 <text x="648" y="144" font-size="15" fill="#8eb5a7" font-weight="700">03</text>
 <text x="746" y="183" text-anchor="middle" font-size="20" fill="#eef9f4" font-weight="700">DATA</text>
 <text x="746" y="217" text-anchor="middle" font-size="16" fill="#bdd3ca">Vocabulary · Records</text>
 <text x="746" y="245" text-anchor="middle" font-size="16" fill="#bdd3ca">Operational Outcomes</text>
<rect x="920" y="112" width="240" height="165" rx="18" fill="#1c3932" stroke="#61a58f"/>
 <text x="942" y="144" font-size="15" fill="#8eb5a7" font-weight="700">04</text>
 <text x="1040" y="183" text-anchor="middle" font-size="20" fill="#eef9f4" font-weight="700">INFORMATION</text>
 <text x="1040" y="217" text-anchor="middle" font-size="16" fill="#bdd3ca">Status · Dashboards</text>
 <text x="1040" y="245" text-anchor="middle" font-size="16" fill="#bdd3ca">Reports · Decisions</text>
<path d="M278 194h35m-9 -8l9 8 -9 8" fill="none" stroke="#69ac98" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
<path d="M572 194h35m-9 -8l9 8 -9 8" fill="none" stroke="#69ac98" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
<path d="M866 194h35m-9 -8l9 8 -9 8" fill="none" stroke="#69ac98" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
<text x="600" y="322" text-anchor="middle" font-size="17" fill="#a8c9bd" font-weight="500">Connected responsibilities · Traceable activity · Actionable information</text>
